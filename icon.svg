<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 64 64" role="img" aria-label="Sharp — novabeast mark">
  <rect width="64" height="64" rx="15" fill="#f4f4f6"/>
  <g fill="#08080a">
    <!-- ears -->
    <path d="M18 25 L11 3 L29 15 Z"/>
    <path d="M46 25 L53 3 L35 15 Z"/>
    <!-- head -->
    <ellipse cx="32" cy="32" rx="14" ry="12"/>
    <!-- cheek fluff + mane -->
    <circle cx="14" cy="39" r="7"/>
    <circle cx="50" cy="39" r="7"/>
    <circle cx="20" cy="47" r="6.5"/>
    <circle cx="44" cy="47" r="6.5"/>
    <circle cx="32" cy="50" r="10"/>
    <!-- muzzle -->
    <path d="M26 39 Q32 36 38 39 L38 45 Q32 50 26 45 Z"/>
  </g>
  <!-- goggles -->
  <rect x="16" y="21.5" width="32" height="6.5" rx="3.25" fill="#f4f4f6"/>
  <circle cx="24" cy="24.7" r="3.2" fill="#08080a"/>
  <circle cx="40" cy="24.7" r="3.2" fill="#08080a"/>
  <!-- nose -->
  <path d="M30 41 L34 41 L32 43.6 Z" fill="#f4f4f6"/>
  <!-- mane notches -->
  <path d="M19 42.5 Q22 45 21 48" stroke="#f4f4f6" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  <path d="M45 42.5 Q42 45 43 48" stroke="#f4f4f6" stroke-width="1.6" fill="none" stroke-linecap="round"/>
</svg>
